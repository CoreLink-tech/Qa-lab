services:
  postgres:
    image: postgres:17-alpine
    container_name: qa-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_lab
      POSTGRES_PASSWORD: qa_lab_password
      POSTGRES_DB: qa_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_lab -d qa_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qa-lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
